; balancebot firmware
;   pio run -e nucleo_f446re   -> tilt estimator (IMU only)
;   pio run -e motor_bench     -> motor + encoder bench test
;   pio run -e motor_step      -> motor step-response test (lag and speed per command)
;   pio run -e balance         -> balance loop (starts in DRY_RUN, motors off)
;   pio run -e balance_rtos    -> the same balance loop as FreeRTOS tasks, with timing measurements
[platformio]
default_envs = nucleo_f446re

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = stm32cube
monitor_speed = 115200
upload_protocol = mbed
build_flags = -lm
build_src_filter = +<*> -<motor_bench.c> -<step_test.c> -<balance_main.c> -<balance_rtos_main.c>

[env:motor_bench]
extends = env:nucleo_f446re
build_src_filter = +<*> -<main.c> -<step_test.c> -<balance_main.c> -<balance_rtos_main.c>

[env:motor_step]
extends = env:nucleo_f446re
build_src_filter = +<*> -<main.c> -<motor_bench.c> -<balance_main.c> -<balance_rtos_main.c>

[env:balance]
extends = env:nucleo_f446re
build_src_filter = +<*> -<main.c> -<motor_bench.c> -<step_test.c> -<balance_rtos_main.c>

[env:balance_rtos]
extends = env:nucleo_f446re
build_src_filter = +<*> -<main.c> -<motor_bench.c> -<step_test.c> -<balance_main.c>