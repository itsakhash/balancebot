; balancebot firmware
;   pio run -e nucleo_f446re   -> tilt estimator (IMU only)
;   pio run -e motor_bench     -> motor + encoder bench test
[platformio]
default_envs = nucleo_f446re

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = stm32cube
monitor_speed = 115200
upload_protocol = mbed
build_flags = -lm
build_src_filter = +<*> -<motor_bench.c>

[env:motor_bench]
extends = env:nucleo_f446re
build_src_filter = +<*> -<main.c>